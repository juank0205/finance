name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# TODO: pin every action to a full commit SHA (Dependabot keeps them updated) and add
# container image scanning (Trivy) + secret scanning once images are built in CI.

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [edge-admin, cloud-dashboard]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: |
          for dir in bootstrap envs/prod; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

  # Read-only plan against the real account. Skipped until the repo variable AWS_PLAN_ROLE_ARN is set.
  plan:
    if: vars.AWS_PLAN_ROLE_ARN != ''
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/prod
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-3
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      # -lock=false keeps the role read-only: no lock file write in the state bucket.
      - run: terraform plan -input=false -lock=false
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
